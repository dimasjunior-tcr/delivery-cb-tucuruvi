<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delivery CB Tucuruvi</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --accent: #f59e0b;
      --accent2: #3b82f6;
      --green: #10b981;
      --red: #ef4444;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #2e3347;
      --radius: 12px;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── LOGIN ── */
    #login-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .login-logo {
      font-size: 2.5rem;
      margin-bottom: 8px;
    }

    .login-card h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .login-card p {
      color: var(--muted);
      font-size: 0.875rem;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 14px;
      text-align: left;
    }

    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus { border-color: var(--accent); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary { background: var(--accent); color: #000; width: 100%; margin-top: 8px; }
    .btn-primary:hover:not(:disabled) { opacity: 0.9; }

    .btn-role {
      width: 100%;
      margin-top: 12px;
      padding: 18px 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      font-size: 1.1rem;
      justify-content: flex-start;
      gap: 14px;
    }
    .btn-role:hover { border-color: var(--accent); background: rgba(245,158,11,0.08); }
    .btn-role-delivery:hover { border-color: var(--accent2); background: rgba(59,130,246,0.08); }
    .role-icon { font-size: 1.4rem; }

    .btn-confirm { background: var(--accent2); color: #fff; }
    .btn-confirm:hover { opacity: 0.85; }

    .btn-done { background: var(--green); color: #fff; }
    .btn-done:hover { opacity: 0.85; }

    .btn-cancel { background: transparent; color: var(--red); border: 1px solid var(--red); }
    .btn-cancel:hover { background: var(--red); color: #fff; }

    .btn-sm { padding: 7px 14px; font-size: 0.82rem; border-radius: 6px; }

    .login-error {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      margin-top: 12px;
      display: none;
    }

    /* ── APP ── */
    #app-screen { display: none; flex-direction: column; min-height: 100vh; }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-left h2 { font-size: 1.1rem; font-weight: 700; }

    .role-badge {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .badge-recepcao { background: rgba(245,158,11,0.2); color: var(--accent); }
    .badge-delivery { background: rgba(59,130,246,0.2); color: var(--accent2); }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-logout:hover { border-color: var(--red); color: var(--red); }

    main { flex: 1; padding: 20px; max-width: 700px; width: 100%; margin: 0 auto; }

    /* ── ADD ORDER FORM ── */
    .add-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
    }

    .add-form h3 {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
    }

    .add-row {
      display: flex;
      gap: 10px;
    }

    .add-row input {
      flex: 1;
      padding: 12px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .add-row input:focus { border-color: var(--accent); }

    .add-row .btn { white-space: nowrap; }

    .form-feedback {
      margin-top: 10px;
      font-size: 0.82rem;
      min-height: 18px;
    }
    .form-feedback.error { color: #fca5a5; }
    .form-feedback.success { color: #6ee7b7; }

    /* ── ORDERS LIST ── */
    .section-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .count-chip {
      background: var(--surface2);
      border-radius: 20px;
      padding: 2px 8px;
      font-size: 0.72rem;
      color: var(--text);
    }

    .orders-section { margin-bottom: 28px; }

    .empty-state {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 28px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .order-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 0.2s;
      animation: slideIn 0.25s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .order-card.status-aguardando { border-left: 3px solid var(--accent); }
    .order-card.status-em_preparo { border-left: 3px solid var(--accent2); }
    .order-card.status-entregue { border-left: 3px solid var(--green); opacity: 0.6; }

    /* ── DELIVERY: enviado (verde) ── */
    .order-card.delivery-sent {
      background: rgba(16,185,129,0.22);
      border-color: rgba(16,185,129,0.6);
      border-left: 4px solid var(--green);
    }
    .order-card.delivery-sent .order-number { color: #6ee7b7; font-weight: 800; }
    .order-card.delivery-sent .order-meta   { color: rgba(110,231,183,0.85); }

    .order-info {}

    .order-number {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .order-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 3px;
    }

    .status-chip {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .chip-aguardando { background: rgba(245,158,11,0.15); color: var(--accent); }
    .chip-em_preparo { background: rgba(59,130,246,0.15); color: var(--accent2); }
    .chip-entregue   { background: rgba(16,185,129,0.15); color: var(--green); }

    .order-actions { display: flex; gap: 8px; flex-shrink: 0; }

    /* ── DELIVERY CLICK AREA ── */
    .order-card.clickable {
      cursor: pointer;
    }
    .order-card.clickable:hover {
      border-color: var(--accent2);
      background: rgba(59,130,246,0.06);
    }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      z-index: 100;
      transition: transform 0.3s ease;
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.toast-success { border-color: var(--green); color: var(--green); }
    #toast.toast-error { border-color: var(--red); color: #fca5a5; }
    #toast.toast-info { border-color: var(--accent2); color: var(--accent2); }

    /* ── ALERT OVERLAY (delivery) ── */
    #alert-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.2s;
    }
    #alert-overlay.show { display: flex; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .alert-box {
      background: var(--surface);
      border: 2px solid var(--accent);
      border-radius: 16px;
      padding: 32px 40px;
      text-align: center;
      animation: pop 0.3s ease;
    }
    @keyframes pop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .alert-box .alert-icon { font-size: 3rem; margin-bottom: 12px; }
    .alert-box h2 { font-size: 1.2rem; margin-bottom: 6px; }
    .alert-box p { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
    .alert-box .order-hl { font-size: 2rem; font-weight: 800; color: var(--accent); }

    /* ── PULSE on waiting orders (delivery) ── */
    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.4); }
      50% { box-shadow: 0 0 0 6px rgba(245,158,11,0); }
    }
    .order-card.pulse { animation: slideIn 0.25s ease, pulse-border 1.8s ease-in-out infinite; }

    @media (max-width: 480px) {
      .order-card { flex-wrap: wrap; }
      .order-actions { width: 100%; justify-content: flex-end; }
      .add-row { flex-direction: column; }
      .alert-box { padding: 24px 20px; margin: 16px; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🛵</div>
    <h1>Delivery CB Tucuruvi</h1>
    <p>Selecione seu perfil para entrar</p>
    <button class="btn btn-role" onclick="doLogin('recepcao')">
      <span class="role-icon">🖥️</span>
      Recepção
    </button>
    <button class="btn btn-role btn-role-delivery" onclick="doLogin('delivery')">
      <span class="role-icon">📦</span>
      Delivery
    </button>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <header>
    <div class="header-left">
      <span>🛵</span>
      <h2>Delivery</h2>
      <span class="role-badge" id="role-badge"></span>
    </div>
    <button class="btn-logout" onclick="doLogout()">Sair</button>
  </header>
  <main id="main-content"></main>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- ALERT OVERLAY (delivery) -->
<div id="alert-overlay">
  <div class="alert-box">
    <div class="alert-icon">🔔</div>
    <h2>Novo Pedido!</h2>
    <div class="order-hl" id="alert-order-number"></div>
    <p>Motoboy aguardando na recepção</p>
    <button class="btn btn-confirm" onclick="closeAlert()">Ver pedidos</button>
  </div>
</div>

<script>
  const socket = io();
  let session = null; // { username, role }
  let orders = [];
  let alertQueue = [];
  let alertOpen = false;

  // ── AUTH ──
  function doLogin(role) {
    session = { username: role, role };
    showApp();
  }

  function doLogout() {
    session = null;
    orders = [];
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app-screen').style.display = 'none';
  }

  function showApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'flex';

    const badge = document.getElementById('role-badge');
    if (session.role === 'recepcao') {
      badge.textContent = 'Recepção';
      badge.className = 'role-badge badge-recepcao';
    } else {
      badge.textContent = 'Delivery';
      badge.className = 'role-badge badge-delivery';
    }

    renderApp();
  }

  // ── SOCKET EVENTS ──
  socket.on('orders-update', (newOrders) => {
    orders = newOrders;
    if (session) renderApp();
  });

  socket.on('new-order-alert', ({ orderNumber }) => {
    if (!session) return;
    if (session.role === 'delivery') {
      playBell();
      queueAlert(orderNumber);
    }
  });

  socket.on('order-added', ({ orderNumber }) => {
    showFormFeedback(`Pedido #${orderNumber} adicionado!`, 'success');
    setTimeout(() => showFormFeedback('', ''), 3000);
  });

  socket.on('order-error', (msg) => {
    showFormFeedback(msg, 'error');
    setTimeout(() => showFormFeedback('', ''), 4000);
  });

  // ── RENDER ──
  let autoAckTimer = null;

  function renderApp() {
    const main = document.getElementById('main-content');
    if (session.role === 'recepcao') {
      main.innerHTML = renderRecepcao();
      document.getElementById('order-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') addOrder();
      });
    } else {
      main.innerHTML = renderDelivery();
      scheduleAutoAck();
    }
  }

  function scheduleAutoAck() {
    clearTimeout(autoAckTimer);
    const aguardando = orders.filter(o => o.status === 'aguardando');
    if (aguardando.length === 0) return;
    autoAckTimer = setTimeout(() => {
      stopAlarm();
      aguardando.forEach(o => {
        socket.emit('ack-order', { role: session.role, id: o.id });
      });
    }, 2000);
  }

  function renderRecepcao() {
    const waiting  = orders.filter(o => o.status === 'aguardando');
    const inProgress = orders.filter(o => o.status === 'em_preparo');
    const sent     = orders.filter(o => o.status === 'enviado');
    const done     = orders.filter(o => o.status === 'entregue');

    return `
      <div class="add-form">
        <h3>🛵 Novo Pedido</h3>
        <div class="add-row">
          <input id="order-input" type="text" inputmode="numeric" placeholder="Número do pedido" maxlength="20" />
          <button class="btn btn-primary" style="width:auto" onclick="addOrder()">Adicionar</button>
        </div>
        <div class="form-feedback" id="form-feedback"></div>
      </div>

      <div class="orders-section">
        <div class="section-title">
          ⏳ Esperando resposta delivery
          <span class="count-chip">${waiting.length}</span>
        </div>
        ${waiting.length === 0
          ? '<div class="empty-state">Nenhum pedido aguardando</div>'
          : waiting.map(o => cardRecepcao(o)).join('')}
      </div>

      <div class="orders-section">
        <div class="section-title">
          📦 Em preparo
          <span class="count-chip">${inProgress.length}</span>
        </div>
        ${inProgress.length === 0
          ? '<div class="empty-state">Nenhum pedido em preparo</div>'
          : inProgress.map(o => cardRecepcao(o)).join('')}
      </div>

      <div class="orders-section">
        <div class="section-title">
          🚀 Enviados para recepção
          <span class="count-chip">${sent.length}</span>
        </div>
        ${sent.length === 0
          ? '<div class="empty-state">Nenhum pedido enviado ainda</div>'
          : sent.map(o => cardRecepcao(o)).join('')}
      </div>

      ${done.length > 0 ? `
      <div class="orders-section">
        <div class="section-title">✅ Entregues</div>
        ${done.map(o => cardRecepcao(o)).join('')}
      </div>` : ''}
    `;
  }

  function cardRecepcao(o) {
    const chips  = { aguardando: 'chip-aguardando', em_preparo: 'chip-em_preparo', enviado: 'chip-em_preparo', entregue: 'chip-entregue' };
    const labels = { aguardando: 'Aguardando', em_preparo: 'Em preparo', enviado: 'Enviado', entregue: 'Entregue' };
    const time = new Date(o.createdAt).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

    let actions = '';
    if (o.status === 'aguardando') {
      actions = `<button class="btn btn-cancel btn-sm" onclick="cancelOrder(${o.id})">Cancelar</button>`;
    } else if (o.status === 'enviado') {
      actions = `<button class="btn btn-done btn-sm" onclick="completeOrder(${o.id})">✓ Entregue</button>`;
    }

    return `
      <div class="order-card status-${o.status}">
        <div class="order-info">
          <div class="order-number">Pedido #${o.orderNumber}</div>
          <div class="order-meta">
            Adicionado às ${time}
            &nbsp;·&nbsp;
            <span class="status-chip ${chips[o.status]}">${labels[o.status]}</span>
          </div>
        </div>
        <div class="order-actions">${actions}</div>
      </div>
    `;
  }

  function renderDelivery() {
    const pending = orders
      .filter(o => o.status === 'aguardando')
      .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

    const inProgress = orders
      .filter(o => o.status === 'em_preparo')
      .sort((a, b) => new Date(b.ackedAt) - new Date(a.ackedAt));

    const sent = orders
      .filter(o => o.status === 'enviado' || o.status === 'entregue')
      .sort((a, b) => new Date(b.confirmedAt) - new Date(a.confirmedAt));

    return `
      <div class="orders-section">
        <div class="section-title">
          🔔 Novos pedidos — clique para dar entrada
          <span class="count-chip">${pending.length}</span>
        </div>
        ${pending.length === 0
          ? '<div class="empty-state">Nenhum pedido aguardando</div>'
          : pending.map(o => cardDelivery(o)).join('')}
      </div>

      <div class="orders-section">
        <div class="section-title">
          📦 Em preparo — clique duplo para enviar
          <span class="count-chip">${inProgress.length}</span>
        </div>
        ${inProgress.length === 0
          ? '<div class="empty-state">Nenhum pedido em preparo</div>'
          : inProgress.map(o => cardDelivery(o)).join('')}
      </div>

      <div class="orders-section">
        <div class="section-title" style="color:var(--green)">
          ✅ Enviados para recepção
          <span class="count-chip">${sent.length}</span>
        </div>
        ${sent.length === 0
          ? '<div class="empty-state">Nenhum pedido enviado ainda</div>'
          : sent.map(o => cardDelivery(o)).join('')}
      </div>
    `;
  }

  function cardDelivery(o) {
    const time = new Date(o.createdAt).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

    if (o.status === 'enviado' || o.status === 'entregue') {
      const sentTime = new Date(o.confirmedAt).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      return `
        <div class="order-card delivery-sent">
          <div class="order-info">
            <div class="order-number">Pedido #${o.orderNumber}</div>
            <div class="order-meta">Motoboy chegou às ${time} &nbsp;·&nbsp; Enviado às ${sentTime}</div>
          </div>
          <div style="font-size:1.5rem">✅</div>
        </div>
      `;
    }

    if (o.status === 'em_preparo') {
      return `
        <div class="order-card status-em_preparo pulse clickable" ondblclick="confirmOrder(${o.id})" title="Clique duplo para enviar para recepção">
          <div class="order-info">
            <div class="order-number">Pedido #${o.orderNumber}</div>
            <div class="order-meta">Motoboy chegou às ${time} &nbsp;·&nbsp; <span class="status-chip chip-em_preparo">Clique duplo para enviar</span></div>
          </div>
          <div style="font-size:1.5rem">📦</div>
        </div>
      `;
    }

    return `
      <div class="order-card status-aguardando pulse">
        <div class="order-info">
          <div class="order-number">Pedido #${o.orderNumber}</div>
          <div class="order-meta">Motoboy chegou às ${time} &nbsp;·&nbsp; <span class="status-chip chip-aguardando">Novo</span></div>
        </div>
        <div style="font-size:1.5rem">🔔</div>
      </div>
    `;
  }

  // ── ACTIONS ──
  function addOrder() {
    const input = document.getElementById('order-input');
    const val = input.value.trim();
    if (!val) { showFormFeedback('Informe o número do pedido.', 'error'); return; }
    socket.emit('add-order', { role: session.role, orderNumber: val });
    input.value = '';
    input.focus();
  }

  function ackOrder(id) {
    socket.emit('ack-order', { role: session.role, id });
    showToast('📦 Pedido em preparo!', 'info');
  }

  function confirmOrder(id) {
    socket.emit('confirm-order', { role: session.role, id });
    showToast('🚀 Enviado para a recepção!', 'success');
  }

  function completeOrder(id) {
    socket.emit('complete-order', { role: session.role, id });
    showToast('✅ Pedido marcado como entregue!', 'success');
  }

  function cancelOrder(id) {
    socket.emit('cancel-order', { role: session.role, id });
  }

  function showFormFeedback(msg, type) {
    const el = document.getElementById('form-feedback');
    if (!el) return;
    el.textContent = msg;
    el.className = 'form-feedback ' + (type || '');
  }

  // ── TOAST ──
  function showToast(msg, type = 'info') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `show toast-${type}`;
    setTimeout(() => { t.className = ''; }, 3200);
  }

  // ── ALERT OVERLAY ──
  function queueAlert(orderNumber) {
    alertQueue.push(orderNumber);
    if (!alertOpen) showNextAlert();
  }

  function showNextAlert() {
    if (alertQueue.length === 0) { alertOpen = false; return; }
    alertOpen = true;
    const num = alertQueue.shift();
    document.getElementById('alert-order-number').textContent = `#${num}`;
    document.getElementById('alert-overlay').classList.add('show');
  }

  function closeAlert() {
    document.getElementById('alert-overlay').classList.remove('show');
    setTimeout(showNextAlert, 400);
  }

  // ── ALARME ──
  let alarmInterval = null;
  let alarmCtx = null;

  function playAlarmOnce() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      alarmCtx = ctx;
      const t = ctx.currentTime;

      function beep(freq, start, dur, vol = 0.6) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(vol, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
        osc.start(start);
        osc.stop(start + dur);
      }

      // Padrão urgente: BIP BIP BIP
      beep(880, t + 0.0,  0.12);
      beep(880, t + 0.18, 0.12);
      beep(880, t + 0.36, 0.12);
      beep(1100, t + 0.6, 0.25);
    } catch (e) {
      console.warn('Audio não disponível:', e);
    }
  }

  function startAlarm() {
    if (alarmInterval) return;
    playAlarmOnce();
    alarmInterval = setInterval(playAlarmOnce, 1200);
  }

  function stopAlarm() {
    if (alarmInterval) {
      clearInterval(alarmInterval);
      alarmInterval = null;
    }
  }

  function playBell() { startAlarm(); }

</script>
</body>
